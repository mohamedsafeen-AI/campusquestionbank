<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Notes - Campus Question Bank</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">Campus Question Bank</a>
      <nav class="nav">
        <a href="materials.html">Materials</a>
        <a href="upload.html" class="active">Upload</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page">
      <div class="page__header">
        <h1>Upload Notes (Admin)</h1>
        <p class="muted">Enter your email to get admin access. Uploads go to Supabase.</p>
      </div>

      <form id="uploadForm" class="form" autocomplete="off">
        <div class="grid">
          <div class="field">
            <label for="adminEmail">Your Email (admin gate)</label>
            <input id="adminEmail" name="adminEmail" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="subjectName">Subject Name</label>
            <input id="subjectName" name="subjectName" type="text" placeholder="e.g., Data Structures" required />
          </div>
          <div class="field">
            <label for="unitName">Unit Name</label>
            <input id="unitName" name="unitName" type="text" placeholder="e.g., Unit 1" required />
          </div>
        </div>

        <div class="field">
          <label for="questions">Important Questions</label>
          <textarea id="questions" name="questions" rows="6" placeholder="Write each question on a new line..." required></textarea>
        </div>

        <div class="field">
          <label for="answers">Answers</label>
          <textarea id="answers" name="answers" rows="6" placeholder="Write the answers corresponding to questions..." required></textarea>
        </div>

        <div class="divider"></div>

        <div class="grid">
          <div class="field">
            <label for="pdfFile">PDF Upload (optional)</label>
            <input id="pdfFile" name="pdfFile" type="file" accept="application/pdf" />
            <p class="help muted">If you provide a PDF, it will be stored in Supabase Storage.</p>
          </div>
          <div class="field">
            <label class="label">Preview</label>
            <div class="pill" id="pdfPreviewPill">No PDF selected</div>
          </div>
        </div>

        <div class="actions">
          <button class="primary-btn" id="submitBtn" type="submit">Upload Material</button>
          <button class="ghost-btn" type="button" id="clearBtn">Clear</button>
        </div>

        <div id="formMessage" class="form-message" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span id="year"></span> Campus Question Bank</span>
      <span class="muted">Blue/white responsive UI</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/upload.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
