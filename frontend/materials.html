<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materials - Campus Question Bank</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">Campus Question Bank</a>
      <nav class="nav">
        <a href="materials.html" class="active">Materials</a>
        <a href="upload.html">Upload</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page">
      <div class="page__header">
        <h1>View Materials</h1>
        <p class="muted">Search by subject name. View/download PDFs when available.</p>
      </div>

      <div class="search search--wide">
        <input id="subjectSearch" type="text" placeholder="Search subject (e.g., Data Structures)" />
        <button id="searchBtn" type="button">Search</button>
      </div>

      <div id="materialsGrid" class="grid-cards" aria-live="polite"></div>

      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-state__title">No materials found</div>
        <div class="muted">Upload notes from the Upload page (admin only).</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span id="year"></span> Campus Question Bank</span>
      <span class="muted">Supabase powered</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/materials_config.js"></script>
  <script src="js/materials.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // If coming from home with ?subject=...
    const subject = new URLSearchParams(window.location.search).get('subject');
    if (subject) document.getElementById('subjectSearch').value = subject;
  </script>
</body>
</html>
