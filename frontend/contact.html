<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Campus Question Bank</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">Campus Question Bank</a>
      <nav class="nav">
        <a href="materials.html">Materials</a>
        <a href="upload.html">Upload</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page">
      <div class="page__header">
        <h1>Contact</h1>
        <p class="muted">Send your message. Backend emails the admin via Gmail SMTP.</p>
      </div>

      <form id="contactForm" class="form" autocomplete="off">
        <div class="grid">
          <div class="field">
            <label for="name">Your Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required />
          </div>
          <div class="field">
            <label for="email">Your Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" placeholder="Type your message..." required></textarea>
        </div>

        <div class="actions">
          <button class="primary-btn" type="submit">Send Message</button>
        </div>

        <div id="contactMessage" class="form-message" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span id="year"></span> Campus Question Bank</span>
      <span class="muted">We respond via email</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/contact.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
